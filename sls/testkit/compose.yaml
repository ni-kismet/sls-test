# SystemLink Server for local development / CI with docker compose.
#   $env:SLS_ADMIN_PASSWORD = '<password>'     # optional: set the web admin password at start
#   docker compose -f testkit/compose.yaml up -d --wait
#   docker compose -f testkit/compose.yaml port sls 80
#   docker compose -f testkit/compose.yaml logs -f sls
#   docker compose -f testkit/compose.yaml down -t 150   # add -v to drop the persistent disk
# Secrets are passed through from the environment (value-less entries), never written here.
name: sls
services:
  sls:
    image: ${SLS_IMAGE:-sls-server:26.5}
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    stop_grace_period: 150s
    ports:
      - "127.0.0.1:${SLS_HTTP_PORT:-0}:80"
    environment:
      RAM_SIZE: ${SLS_RAM:-8G}
      CPU_CORES: ${SLS_CPU:-4}
      # No SLS_CONFIG entry: a value-less entry with the variable unset removes the image's own SLS_CONFIG (a
      # configuration image would boot base). To pick another configuration, add: SLS_CONFIG: <name>
      SLS_ADMIN_PASSWORD:
      SLS_HEALTH_AUTH:
      SLS_LICENSE_USER:
    volumes:
      # Persistent disk: remove this line (and the volume below) for a fresh, ephemeral server on every start.
      - sls-storage:/storage
      # User-based license files (*.lic); the folder may be empty.
      - ${SLS_LICENSE_DIR:-./licenses}:/licenses:ro
volumes:
  sls-storage:
