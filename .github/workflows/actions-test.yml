name: actions-test

# W6B.5: exercises the reusable actions end to end: sls-build-image (base, optionally seeded, optionally pushed) ->
# sls-start-server on the local image -> coverage / seed verification; with push, a second job starts the pushed image
# from the registry. Logs go through sls-collect-logs.

on:
  workflow_dispatch:
    inputs:
      config:
        description: Seeded image to build on the base (none = base only)
        type: choice
        options: [none, migration, demo]
        default: migration
      base-image:
        description: Seed this existing image instead of building a base (for example ghcr.io/rajsite/sls-server-actions-test:26.5)
        default: ''
      push:
        description: Push to ghcr.io/rajsite/sls-server-actions-test (a new package from this public repo is PUBLIC)
        type: boolean
        default: false
      reject-cpus:
        description: Host CPU models to fail fast on (extended regex)
        default: ''

permissions:
  contents: read
  packages: write

concurrency: actions-test

env:
  REPOSITORY: ghcr.io/rajsite/sls-server-actions-test
  CONFIG: ${{ inputs.config != 'none' && inputs.config || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        uses: ./.github/actions/sls-build-image
        with:
          admin-password: ${{ secrets.SLS_ADMIN_PASSWORD }}
          config: ${{ env.CONFIG }}
          base-image: ${{ inputs.base-image }}
          repository: ${{ env.REPOSITORY }}
          tags: r${{ github.run_number }}
          reject-cpus: ${{ inputs.reject-cpus }}
          push: ${{ inputs.push }}
          allow-new-package: 'true'
          log-artifact: build-logs

      - name: Start (local image)
        id: start
        uses: ./.github/actions/sls-start-server
        with:
          image: ${{ steps.build.outputs.image }}
          admin-password: ${{ secrets.SLS_ADMIN_PASSWORD }}
          pull: 'false'
          host-prep: 'false'

      - name: Check
        env:
          SLS_ADMIN_PASSWORD: ${{ secrets.SLS_ADMIN_PASSWORD }}
          BUILD_OUT: ${{ toJSON(steps.build.outputs) }}
          START_OUT: ${{ toJSON(steps.start.outputs) }}
        shell: pwsh
        run: scripts/ci/Test-SlsActionsRun.ps1

      - name: Server logs
        if: failure()
        uses: ./.github/actions/sls-collect-logs
        with:
          artifact: server-logs
          container: sls
          path: ${{ runner.temp }}/sls-start-logs
          admin-password: ${{ secrets.SLS_ADMIN_PASSWORD }}

  start-from-registry:
    needs: build
    if: inputs.push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Start (pulled image)
        id: start
        uses: ./.github/actions/sls-start-server
        with:
          image: ${{ needs.build.outputs.image }}
          admin-password: ${{ secrets.SLS_ADMIN_PASSWORD }}

      - name: Check
        env:
          SLS_ADMIN_PASSWORD: ${{ secrets.SLS_ADMIN_PASSWORD }}
          START_OUT: ${{ toJSON(steps.start.outputs) }}
        shell: pwsh
        run: scripts/ci/Test-SlsActionsRun.ps1

      - name: Server logs
        if: failure()
        uses: ./.github/actions/sls-collect-logs
        with:
          artifact: registry-server-logs
          container: sls
          path: ${{ runner.temp }}/sls-start-logs
          admin-password: ${{ secrets.SLS_ADMIN_PASSWORD }}
