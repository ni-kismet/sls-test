name: package-delete

# Deletes a container package of this account that this repository published (GITHUB_TOKEN has admin rights on it).
# Used to remove W4B test images; also the way out if a package was published with the wrong visibility.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Container package name under ghcr.io/rajsite
        default: sls-server-soak
      confirm:
        description: Type the package name again to confirm
        required: true

permissions:
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ inputs.package }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$PKG" = "$CONFIRM" ] || { echo "::error::confirm does not match package"; exit 1; }
          case "$PKG" in sls-server*) ;; *) echo "::error::only sls-server* packages"; exit 1;; esac
          gh api -X DELETE "/users/${{ github.repository_owner }}/packages/container/$PKG"
          echo "deleted ghcr.io/${{ github.repository_owner }}/$PKG"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/$PKG:pull")
          echo "anonymous pull token request after delete: HTTP $code"
