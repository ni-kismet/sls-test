name: build-images

# Builds the SystemLink Server images and publishes them to ghcr.io. Weekly (a fresh base, so the 45-day module
# evaluation never lapses, plus demo and migration, promoted) and by manual dispatch.
#   base     sls-build-image: base image, pushed with its immutable tags only (<x.y.z>-<yyyyMMdd-HHmm>, r<run>); or, with
#            the base-image input, an existing base resolved to its digest (re-seed without a 60-90 min base build)
#   seed     one job per configuration (parallel, fresh runners): sls-build-image seeds the base digest, pushes
#            <x.y.z>-<yyyyMMdd-HHmm>-<config> and r<run>-<config>, records its digest (artifact image-<config>)
#   smoke    one job per seeded image (the base when there is none), fresh runners: sls-start-server pulls it by digest,
#            then the service coverage and the seed's -Verify
#   promote  after every image of the run passed smoke: images.json (artifact images), job
#            summary, and with promote the floating tags <sls-version>[-<config>] and <x.y.z>[-<config>]
# A failed job leaves the floating tags where they were; re-run the failed jobs to promote.

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      sls-version:
        description: SystemLink Server feed version
        default: '26.5'
      packages:
        description: NI packages, comma separated ('' = server + Software Configuration, Test and Asset modules)
        default: ''
      configs:
        description: Built-in seeds to build (src/seeds), comma separated ('' = base only)
        default: demo,migration
      base-image:
        description: Seed this existing base image (tag or digest in the repository) instead of building one
        default: ''
      promote:
        description: Move the floating tags to the new images
        type: boolean
        default: true
      repository:
        description: Image repository
        default: ghcr.io/ni-kismet/sls-server
      reject-cpus:
        description: Host CPU models to fail fast on (extended regex)
        default: ''

permissions:
  contents: read
  packages: write

concurrency: build-images

# A scheduled run has no inputs; these are the dispatch defaults.
env:
  REPOSITORY: ${{ inputs.repository || 'ghcr.io/ni-kismet/sls-server' }}
  SLS_VERSION: ${{ inputs.sls-version || '26.5' }}
  CONFIGS: ${{ github.event_name == 'schedule' && 'demo,migration' || inputs.configs }}
  PROMOTE: ${{ github.event_name == 'schedule' || inputs.promote }}

jobs:
  matrix:
    runs-on: ubuntu-26.04
    outputs:
      configs: ${{ steps.m.outputs.configs }}
      smoke: ${{ steps.m.outputs.smoke }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: src/seeds

      - id: m
        shell: pwsh
        run: |
          $c = @($env:CONFIGS -split '[,\s]+' | Where-Object { $_ })
          foreach ($n in $c) { if (-not (Test-Path "src/seeds/$n/Seed.ps1")) { throw "no built-in seed '$n' (src/seeds/<name>/Seed.ps1)" } }
          $json = if ($c.Count) { $c | ConvertTo-Json -AsArray -Compress } else { '[]' }
          # Each seeded image contains the base, so the base is smoke-tested on its own only when nothing is seeded.
          $smoke = if ($c.Count) { $json } else { '["base"]' }
          Write-Host "configs=$json smoke=$smoke (event $env:GITHUB_EVENT_NAME, promote $env:PROMOTE, $env:REPOSITORY)"
          "configs=$json", "smoke=$smoke" | Add-Content $env:GITHUB_OUTPUT

  base:
    runs-on: ubuntu-26.04
    timeout-minutes: 340
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Build base
        id: build
        if: inputs.base-image == ''
        uses: ./sls-build-image
        with:
          repository: ${{ env.REPOSITORY }}
          sls-version: ${{ env.SLS_VERSION }}
          packages: ${{ inputs.packages }}
          tags: r${{ github.run_number }}
          reject-cpus: ${{ inputs.reject-cpus }}
          push: 'true'
          floating-tag: 'false'
          log-artifact: base-logs

      - name: Existing base
        id: existing
        if: inputs.base-image != ''
        shell: pwsh
        env:
          REF: ${{ inputs.base-image }}
          TOKEN: ${{ github.token }}
        run: |
          $name = $env:REPOSITORY -replace '^ghcr\.io/', ''
          if ($env:REF -notmatch "^$([regex]::Escape($env:REPOSITORY))(:(?<tag>[\w.-]+)|@(?<digest>sha256:[0-9a-f]{64}))$") {
            throw "base-image must be ${env:REPOSITORY}:<tag> or ${env:REPOSITORY}@sha256:<digest> (got '$env:REF')"
          }
          $reference = if ($matches.digest) { $matches.digest } else { $matches.tag }
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$(($name -split '/')[0]):$env:TOKEN"))
          $bearer = (Invoke-RestMethod "https://ghcr.io/token?scope=repository:${name}:pull" -Headers @{ Authorization = "Basic $basic" }).token
          $accept = 'application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json'
          $r = Invoke-WebRequest "https://ghcr.io/v2/$name/manifests/$reference" -Method Head -SkipHttpErrorCheck -Headers @{ Authorization = "Bearer $bearer"; Accept = $accept }
          if ([int]$r.StatusCode -ne 200) { throw "$env:REF not found in the registry ($($r.StatusCode))" }
          $image = "$env:REPOSITORY@$($r.Headers['Docker-Content-Digest'])"
          Write-Host "base image $env:REF -> $image"
          "image=$image" | Add-Content $env:GITHUB_OUTPUT

      - name: Output
        id: out
        shell: pwsh
        env:
          BUILT: ${{ steps.build.outputs.digest }}
          EXISTING: ${{ steps.existing.outputs.image }}
        run: |
          $image = if ($env:EXISTING) { $env:EXISTING } else { $env:BUILT }
          if ($image -notmatch '@sha256:[0-9a-f]{64}$') { throw "no base image digest (build: '$env:BUILT')" }
          "image=$image" | Add-Content $env:GITHUB_OUTPUT

  seed:
    needs: [matrix, base]
    if: needs.matrix.outputs.configs != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.matrix.outputs.configs) }}
    steps:
      - uses: actions/checkout@v7

      - name: Seed ${{ matrix.config }}
        id: build
        uses: ./sls-build-image
        with:
          base-image: ${{ needs.base.outputs.image }}
          seed: ${{ matrix.config }}
          repository: ${{ env.REPOSITORY }}
          sls-version: ${{ env.SLS_VERSION }}
          tags: r${{ github.run_number }}
          reject-cpus: ${{ inputs.reject-cpus }}
          push: 'true'
          floating-tag: 'false'
          log-artifact: seed-${{ matrix.config }}-logs

      - name: Record
        shell: pwsh
        env:
          CONFIG: ${{ matrix.config }}
          OUT: ${{ toJSON(steps.build.outputs) }}
        run: |
          $o = $env:OUT | ConvertFrom-Json
          if ($o.digest -notmatch '@sha256:[0-9a-f]{64}$') { throw "no digest for $env:CONFIG" }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/image" | Out-Null
          [ordered]@{ config = $env:CONFIG; image = $o.digest; tag = $o.image; minutes = $o.minutes; attempts = $o.'config-attempts'; host_cpu = $o.'host-cpu' } |
            ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/image/image-$env:CONFIG.json"

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.config }}
          path: ${{ runner.temp }}/image/image-${{ matrix.config }}.json
          retention-days: 7

  smoke:
    needs: [matrix, base, seed]
    # Runs when the base and every seeded image are pushed (seed is skipped when configs is empty).
    if: >-
      !cancelled() && needs.base.result == 'success' &&
      (needs.seed.result == 'success' || (needs.seed.result == 'skipped' && needs.matrix.outputs.configs == '[]'))
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.smoke) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        if: matrix.image != 'base'
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}/image

      - name: Image
        id: image
        shell: pwsh
        env:
          NAME: ${{ matrix.image }}
          BASE: ${{ needs.base.outputs.image }}
        run: |
          $image = if ($env:NAME -eq 'base') { $env:BASE } else { (Get-Content "$env:RUNNER_TEMP/image/image-$env:NAME.json" -Raw | ConvertFrom-Json).image }
          if ($image -notmatch '@sha256:[0-9a-f]{64}$') { throw "no digest for ${env:NAME}: '$image'" }
          $seed = if ($env:NAME -ne 'base') { "src/seeds/$env:NAME/Seed.ps1" } else { '' }
          Write-Host "smoke ${env:NAME}: $image"
          "image=$image", "seed=$seed" | Add-Content $env:GITHUB_OUTPUT

      - name: Start
        id: start
        uses: ./sls-start-server
        with:
          image: ${{ steps.image.outputs.image }}

      - name: Check
        shell: pwsh
        env:
          START_OUT: ${{ toJSON(steps.start.outputs) }}
          SEED: ${{ steps.image.outputs.seed }}
        run: ./tests/Test-SlsActionsRun.ps1

      - name: Logs
        if: failure() && steps.start.outcome != 'skipped'
        uses: ./sls-collect-logs
        with:
          container: sls
          artifact: smoke-${{ matrix.image }}-logs

  promote:
    needs: [matrix, base, seed, smoke]
    # Runs only when every image of the run passed smoke.
    if: ${{ !cancelled() && needs.smoke.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        if: needs.matrix.outputs.configs != '[]'
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/image

      - name: Publish
        id: publish
        shell: pwsh
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          BASE: ${{ needs.base.outputs.image }}
          CONFIGS: ${{ join(fromJSON(needs.matrix.outputs.configs), ',') }}
        run: |
          $p = @{
            Repository = $env:REPOSITORY; SlsVersion = $env:SLS_VERSION; BaseImage = $env:BASE
            SeedDir = "$env:RUNNER_TEMP/image"; Configs = $env:CONFIGS; Promote = ($env:PROMOTE -eq 'true')
            Out = "$env:RUNNER_TEMP/images.json"
          }
          src/ci/Publish-SlsImages.ps1 @p

      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: ${{ steps.publish.outputs.images }}
          retention-days: 90
