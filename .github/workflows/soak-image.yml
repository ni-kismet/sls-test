name: soak-image

# W4B: builds the SystemLink Server image on a hosted runner (nested KVM) and records build attempts and Windows
# bugchecks during install/seal/verify. Pushing (to a throwaway test package) is opt-in, see the push input.

on:
  workflow_dispatch:
    inputs:
      ram:
        description: Build VM RAM (the runner has 16 GB)
        default: '10G'
      cpu:
        description: Build VM vCPUs
        default: '4'
      max-attempts:
        description: Build attempts (a failure resumes the failed stage; a failed Install starts over)
        default: '3'
      min-free-gb:
        description: Docker free GB required by sls-host-prep
        default: '60'
      on-bugcheck:
        description: After a build VM bugcheck past Install, restart (fresh Install) or resume the stage
        type: choice
        options: [restart, resume]
        default: restart
      push:
        description: Push to ghcr.io/rajsite/sls-server-soak
        type: boolean
        default: false
      allow-new-package:
        description: Let the push create the package (from this public repo's GITHUB_TOKEN a new package is PUBLIC)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency: soak-image

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: ./.github/actions/sls-build-image
        with:
          admin-password: ${{ secrets.SLS_ADMIN_PASSWORD }}
          repository: ghcr.io/rajsite/sls-server-soak
          tags: r${{ github.run_number }}
          ram: ${{ inputs.ram }}
          cpu: ${{ inputs.cpu }}
          max-attempts: ${{ inputs.max-attempts }}
          on-bugcheck: ${{ inputs.on-bugcheck }}
          min-free-gb: ${{ inputs.min-free-gb }}
          push: ${{ inputs.push }}
          allow-new-package: ${{ inputs.allow-new-package }}
          log-artifact: soak-image-logs