name: cleanup-images

# Deletes image versions older than older-than-days (default 45, the module evaluation period) from a ghcr.io package,
# with src/ci/Remove-SlsImageVersions.ps1. Optional housekeeping: storage of public packages is free. Always kept:
# floating tags (26.5, 26.5.1, 26.5-demo, ...) and the manifests they list. Dry run unless delete is checked.
# Pull requests that change the cleanup run a dry run (0 days, so the rules run on every version) against both
# packages; only a manual dispatch can delete.
# Deleting needs the Admin role for this repository under each package's Manage Actions access.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package
        type: choice
        options: [sls-server, sls-server-actions-test]
        default: sls-server
      older-than-days:
        description: Delete versions created more than this many days ago
        default: '45'
      delete:
        description: Delete (unchecked = dry run, lists what would be deleted)
        type: boolean
        default: false
  pull_request:
    paths: [.github/workflows/cleanup-images.yml, src/ci/Remove-SlsImageVersions.ps1]

permissions:
  contents: read
  packages: write

concurrency: cleanup-images-${{ github.ref }}

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.package) || '["sls-server","sls-server-actions-test"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: src/ci

      - name: Remove old versions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}
          # A pull request's dry run uses 0 days so the keep/delete rules run on every version.
          DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.older-than-days || '0' }}
          DELETE: ${{ github.event_name == 'workflow_dispatch' && inputs.delete }}
        run: src/ci/Remove-SlsImageVersions.ps1 -Repository $env:PACKAGE -OlderThanDays ([int]$env:DAYS) -Delete:($env:DELETE -eq 'true')
