name: sls-host-prep
description: >
  Prepare a GitHub-hosted Ubuntu runner for SystemLink Server image work: make sure Docker has enough free space,
  check KVM/TUN from a container, optionally log in to GHCR and stage a license file. (sls-build-image and
  sls-start-server run the same script; use this action only for custom jobs.)

inputs:
  min-free-gb:
    description: Minimum free GB required in the Docker data root. Space is only reclaimed when below this.
    default: '60'
  registry-login:
    description: Log in to ghcr.io with registry-token ('true'/'false').
    default: 'false'
  registry-token:
    description: Token for ghcr.io (needs packages:write to push, packages:read to pull).
    default: ${{ github.token }}
  license-b64:
    description: Optional base64 license file. Written to $RUNNER_TEMP/sls-licenses; the folder is exported as SLS_LICENSE_DIR.
    default: ''

outputs:
  docker-free-gb:
    description: Free GB in the Docker data root after preparation.
    value: ${{ steps.prep.outputs.docker-free-gb }}

runs:
  using: composite
  steps:
    - name: Host prep
      id: prep
      shell: bash
      env:
        MIN_FREE_GB: ${{ inputs.min-free-gb }}
        REGISTRY_LOGIN: ${{ inputs.registry-login }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        REGISTRY_USER: ${{ github.actor }}
        LICENSE_B64: ${{ inputs.license-b64 }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/host-prep.sh"
