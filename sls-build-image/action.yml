name: sls-build-image
description: >
  Build a SystemLink Server container image on a GitHub-hosted Ubuntu runner (nested KVM): the base image (60-90 min,
  retried after build VM crashes) or an existing base, optionally a seeded image on top (10-15 min), optionally
  pushed to ghcr.io. Writes a job summary and uploads leak-checked logs.

inputs:
  seed:
    description: >-
      Seeded image to build on the base: a built-in seed (demo, migration) or the path of a seed script in your
      workspace (docs/seeds.md). '' = base image only.
    default: ''
  config-name:
    description: Name of the seeded configuration (tag suffix; default the built-in name or the seed's folder name).
    default: ''
  base-image:
    description: Existing base image to seed instead of building one (for example ghcr.io/rajsite/sls-server:26.5). Needs seed.
    default: ''
  repository:
    description: Repository of the images built here.
    default: ghcr.io/${{ github.repository_owner }}/sls-server
  push:
    description: Push the images built here to ghcr.io ('true'/'false').
    default: 'false'
  tags:
    description: Extra tags, one per line (the seeded image gets <tag>-<config-name>).
    default: ''
  floating-tag:
    description: >-
      Also push the moving tags <repository>:<sls-version> (base) and <repository>:<sls-version>-<config-name>
      (seeded) ('true'/'false').
    default: 'true'
  admin-password:
    description: Web admin password (user admin) of the images built here. Not a secret by default.
    default: test
  sls-version:
    description: SystemLink Server version (feed version) of a base image built here.
    default: '26.5'
  packages:
    description: NI packages to install, comma or newline separated ('' = SystemLink Server + test, asset, software config modules).
    default: ''
  registry-token:
    description: Token for ghcr.io (packages:write to push; packages:read to pull base-image).
    default: ${{ github.token }}
  license-b64:
    description: Optional base64 user-based license file for the seed and verify containers (never part of the image).
    default: ''
  license-user:
    description: Windows user the license file is issued to.
    default: ''
  ram:
    description: Build VM RAM (a hosted runner has 16 GB).
    default: '10G'
  cpu:
    description: Build VM vCPUs.
    default: '4'
  max-attempts:
    description: Build attempts for each image.
    default: '3'
  reject-cpus:
    description: Extended regex of host CPU models to fail fast on (for example 'EPYC 9V45'); '' accepts any host.
    default: ''
  host-prep:
    description: Prepare the runner (free space, KVM check, registry login).
    default: 'true'
  min-free-gb:
    description: Free GB required in the Docker data root.
    default: '60'
  upload-logs:
    description: "'always', 'failure' or 'never'."
    default: always
  log-artifact:
    description: Log artifact name ('' = sls-build-logs-<job>-<random>).
    default: ''

outputs:
  image:
    description: Built image (the seeded image when seed is set, else the base image).
    value: ${{ steps.build.outputs.image }}
  tags:
    description: Tags of image, comma separated.
    value: ${{ steps.build.outputs.tags }}
  digest:
    description: Registry digest of image (<repo>@sha256:...) when pushed.
    value: ${{ steps.push.outputs.digest }}
  base-image:
    description: Base image (built or given).
    value: ${{ steps.build.outputs.base_image }}
  config-name:
    description: Name of the seeded configuration.
    value: ${{ steps.build.outputs.config_name }}
  public:
    description: "'true' when the pushed package allows anonymous pulls."
    value: ${{ steps.push.outputs.public }}
  build-id:
    description: Final base build id.
    value: ${{ steps.build.outputs.build_id }}
  attempts:
    description: Base build attempts.
    value: ${{ steps.build.outputs.attempts }}
  bugchecks:
    description: Build VM bugchecks of the base build.
    value: ${{ steps.build.outputs.bugchecks }}
  config-attempts:
    description: Seeded image attempts.
    value: ${{ steps.build.outputs.config_attempts }}
  host-cpu:
    description: Host CPU model.
    value: ${{ steps.facts.outputs.host-cpu }}
  minutes:
    description: Build minutes (base + seeded image, without push).
    value: ${{ steps.build.outputs.minutes }}
  versions:
    description: Installed versions (JSON).
    value: ${{ steps.build.outputs.versions }}

runs:
  using: composite
  steps:
    - name: Preflight
      shell: pwsh
      env:
        SLS_OUT: ${{ runner.temp }}/sls
        IN_SEED: ${{ inputs.seed }}
        IN_CONFIG_NAME: ${{ inputs.config-name }}
        IN_BASE_IMAGE: ${{ inputs.base-image }}
        IN_UPLOAD_LOGS: ${{ inputs.upload-logs }}
      run: |
        if ($env:IN_UPLOAD_LOGS -notin 'always', 'failure', 'never') { throw "upload-logs must be always, failure or never (got '$env:IN_UPLOAD_LOGS')" }
        & "$env:GITHUB_ACTION_PATH/../src/ci/Build-SlsCi.ps1" -BuildId preflight -Seed $env:IN_SEED -ConfigName $env:IN_CONFIG_NAME -BaseImage $env:IN_BASE_IMAGE -Preflight

    - name: Host facts
      id: facts
      shell: bash
      env:
        FACTS_DIR: ${{ runner.temp }}/sls
        RUNNER_ID: ${{ runner.name }}
        REJECT_CPUS: ${{ inputs.reject-cpus }}
      run: bash "$GITHUB_ACTION_PATH/../src/ci/host-facts.sh"

    - name: Host prep
      if: inputs.host-prep == 'true'
      id: prep
      shell: bash
      env:
        MIN_FREE_GB: ${{ inputs.min-free-gb }}
        REGISTRY_LOGIN: ${{ (inputs.push == 'true' || startsWith(inputs.base-image, 'ghcr.io/')) && 'true' || 'false' }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        REGISTRY_USER: ${{ github.actor }}
        LICENSE_B64: ${{ inputs.license-b64 }}
      run: bash "$GITHUB_ACTION_PATH/../src/ci/host-prep.sh"

    - name: Build
      id: build
      shell: pwsh
      env:
        SLS_OUT: ${{ runner.temp }}/sls
        SLS_ACTION_REPOSITORY: ${{ github.action_repository }}
        SLS_ACTION_REF: ${{ github.action_ref }}
        SLS_BUILD_ADMIN_PASSWORD: ${{ inputs.admin-password }}
        IN_SEED: ${{ inputs.seed }}
        IN_CONFIG_NAME: ${{ inputs.config-name }}
        IN_BASE_IMAGE: ${{ inputs.base-image }}
        IN_REPOSITORY: ${{ inputs.repository }}
        IN_SLS_VERSION: ${{ inputs.sls-version }}
        IN_PACKAGES: ${{ inputs.packages }}
        IN_RAM: ${{ inputs.ram }}
        IN_CPU: ${{ inputs.cpu }}
        IN_TAGS: ${{ inputs.tags }}
        IN_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        IN_LICENSE_USER: ${{ inputs.license-user }}
        IN_LICENSE_DIR: ${{ steps.prep.outputs.license-dir }}
        BUILD_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      run: |
        if ($env:SLS_BUILD_ADMIN_PASSWORD -ne 'test') { Write-Host "::add-mask::$env:SLS_BUILD_ADMIN_PASSWORD" }
        $p = @{
          BuildId = ($env:BUILD_ID -replace '[^A-Za-z0-9_.-]', '-'); SlsVersion = $env:IN_SLS_VERSION; Packages = $env:IN_PACKAGES
          Repository = $env:IN_REPOSITORY.ToLowerInvariant(); ExtraTag = $env:IN_TAGS; Ram = $env:IN_RAM; Cpu = [int]$env:IN_CPU
          MaxAttempts = [int]$env:IN_MAX_ATTEMPTS; ConfigAttempts = [int]$env:IN_MAX_ATTEMPTS
          BaseImage = $env:IN_BASE_IMAGE; Seed = $env:IN_SEED; ConfigName = $env:IN_CONFIG_NAME; LicenseUser = $env:IN_LICENSE_USER
        }
        if ($env:IN_LICENSE_DIR) { $p.LicenseFile = Join-Path $env:IN_LICENSE_DIR 'sls.lic' }
        & "$env:GITHUB_ACTION_PATH/../src/ci/Build-SlsCi.ps1" @p

    - name: Push
      id: push
      if: inputs.push == 'true'
      shell: pwsh
      env:
        BASE_IMAGE_IN: ${{ inputs.base-image }}
        BASE_IMAGE: ${{ steps.build.outputs.base_image }}
        BASE_TAGS: ${{ steps.build.outputs.base_tags }}
        CONFIG_IMAGE: ${{ steps.build.outputs.config_image }}
        CONFIG_TAGS: ${{ steps.build.outputs.tags }}
        FLOATING_TAG: ${{ inputs.floating-tag }}
        FLOATING_TAGS: ${{ steps.build.outputs.floating_tags }}
      run: |
        $push = "$env:GITHUB_ACTION_PATH/../src/ci/Push-SlsImage.ps1"
        $final = $env:GITHUB_OUTPUT
        $skip = if ($env:FLOATING_TAG -eq 'true') { @() } else { @($env:FLOATING_TAGS -split ',') }
        $sets = @()
        if (-not $env:BASE_IMAGE_IN) { $sets += , @($env:BASE_IMAGE, $env:BASE_TAGS) }
        if ($env:CONFIG_IMAGE) { $sets += , @($env:CONFIG_IMAGE, $env:CONFIG_TAGS) }
        $lines = @(); $o = @{}
        foreach ($s in $sets) {
          # The last push (the seeded image when there is one) provides the step outputs.
          $tags = @($s[1] -split ',' | Where-Object { $_ -and $_ -notin $skip })
          $tmp = New-TemporaryFile; $env:GITHUB_OUTPUT = $tmp.FullName
          try { & $push -Image $s[0] -Tag $tags }
          finally { $env:GITHUB_OUTPUT = $final }
          $o = @{}; foreach ($l in Get-Content $tmp) { if ($l -match '^([\w-]+)=(.*)$') { $o[$matches[1]] = $matches[2] } }
          $lines += "Pushed ``$($o.digest)`` ($($o.tags)) in $($o.push_sec) s$(if ($o.public -eq 'true') { ' (public package)' })"
        }
        foreach ($k in 'digest', 'public') { "$k=$($o[$k])" | Add-Content $final }
        $lines -join "`n" | Add-Content $env:GITHUB_STEP_SUMMARY

    - name: Logs
      id: logs
      if: always() && (inputs.upload-logs == 'always' || (inputs.upload-logs == 'failure' && failure()))
      shell: pwsh
      env:
        SLS_OUT: ${{ runner.temp }}/sls
        SLS_BUILD_ADMIN_PASSWORD: ${{ inputs.admin-password }}
        ARTIFACT: ${{ inputs.log-artifact }}
      run: |
        # builds/ and configs/ hold every attempt (failed seeded attempts as configs/<name>-fail<n>).
        $paths = 'builds', 'configs', 'ci-build.json', 'runner.json' | ForEach-Object { Join-Path $env:SLS_OUT $_ }
        $out = Join-Path $env:RUNNER_TEMP "sls-build-logs-$([guid]::NewGuid().ToString('N').Substring(0, 8))"
        $name = if ($env:ARTIFACT) { $env:ARTIFACT } else { "sls-build-logs-$env:GITHUB_JOB-$([guid]::NewGuid().ToString('N').Substring(0, 6))" }
        "dir=$out" | Add-Content $env:GITHUB_OUTPUT
        "name=$name" | Add-Content $env:GITHUB_OUTPUT
        & "$env:GITHUB_ACTION_PATH/../src/ci/Collect-SlsLogs.ps1" -Out $out -Path ($paths -join "`n")

    - name: Upload logs
      if: always() && steps.logs.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.logs.outputs.name }}
        path: ${{ steps.logs.outputs.dir }}
        if-no-files-found: ignore
        retention-days: 7
